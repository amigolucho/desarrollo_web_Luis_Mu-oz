<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar aviso</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css">
    <link rel="stylesheet" type="text/css" href="../css/agregar_avisos.css">
</head>
<body>
    <div class="navbar">
        <a class="navbar-page" href="../html/agregar_aviso.html">Agregar aviso</a>
        <a class="navbar-page" href="../html/lista_avisos.html">Lista de adopciones</a>
        <a class="navbar-page" href="../html/estadisticas.html">Estadísticas</a>
    </div>
    <p id="a">oal</p>
    <form class="formulario" id="aviso" method="post" enctype="multipart/form-data">
        <div id="lugar">
            <label for="region" class="obligatorio">Región</label>
            <input id="region" name="region" type="text" class="grupo-input">
            
            <label for="comuna" class="obligatorio">Comuna</label>
            <input id="comuna" type="text" name="comuna" class="grupo-input">
            
            <label for="sector">Sector</label>
            <input id="sector" type="text" name="sector" class="grupo-input">
        </div>
        <p>Contacto</p>
        <div id="contacto">
            <label for="name" class="obligatorio">Nombre</label>
            <input id="name" type="text" name="name" class="grupo-input">

            <label for="email" class="obligatorio">Email</label>
            <input id="email" type="text" name="email" class="grupo-input">

            <label for="phone">Número de Celular</label>
            <input id="phone" type="tel" name="phone" class="grupo-input">

            <label for="chanel">Contactar por</label>
            <input id="chanel" type="text" name="chanel" class="grupo-input">
        </div>
        <p>Mascota</p>
        <div id="mascota"></div>
        <div>
            <label for="type" class="obligatorio">Tipo</label>
            <input id="type" type="text" name="type" class="grupo-input">

            <label for="name" class="obligatorio">Cantidad</label>
            <input id="name" type="number" name="name" class="grupo-input">

            <label for="name" class="obligatorio">Edad</label>
            <input id="name" type="number" name="name" class="grupo-input">

            <label for="name" class="obligatorio">Unidad de medida edad</label>
            <input id="name" type="text" name="name" class="grupo-input">

            <label for="name" class="obligatorio">Fecha disponible para entrega</label>
            <input id="name" type="text" name="name" class="grupo-input">

            <label for="name">Descripción</label>
            <input id="name" type="text" name="name" class="grupo-input">

            <label for="name" class="obligatorio">Foto</label>
            <input id="name" type="text" name="name" class="grupo-input">
        </div>
    </form>
    <button id="add-aviso">Agregar este aviso de adopción</button>
</body>
<script src="../js/agregar_aviso.js"></script>
</html>
