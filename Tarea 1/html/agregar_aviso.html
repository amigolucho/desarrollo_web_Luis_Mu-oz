<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar aviso</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css">
    <link rel="stylesheet" type="text/css" href="../css/agregar_avisos.css">
</head>
<body>
    <div class="navbar">
        <a class="navbar-page" href="../html/agregar_aviso.html">Agregar aviso</a>
        <a class="navbar-page" href="../html/lista_avisos.html">Lista de adopciones</a>
        <a class="navbar-page" href="../html/estadisticas.html">Estadísticas</a>
    </div>
<div class="formulario">
    <form id="aviso" method="post" enctype="multipart/form-data">
        <h1>Agrega tu aviso!</h1>
        <h2>Lugar</h2>
        <div id="lugar">
            <label for="region" class="obligatorio">Región</label>
            <select id="region" name="region">    
                <option value="">Selecione una región</option>
            </select>
            
            <label for="comuna" class="obligatorio">Comuna</label>
            <select id="comuna" name="comuna">    
                <option value="">Selecione una comuna</option>
            </select>
            
            <label for="sector">Sector</label>
            <input id="sector" type="text" name="sector" class="grupo-input" size="100">
        </div>
        <h2>Contacto</h2>
        <div id="contacto">
            <label for="name" class="obligatorio">Nombre</label>
            <input id="name" type="text" name="name" class="grupo-input">

            <label for="email" class="obligatorio">Email</label>
            <input id="email" type="email" name="email" class="grupo-input">

            <label for="phone">Número de Celular</label>
            <input id="phone" type="tel" name="phone" class="grupo-input" placeholder="+123.12345678">

            <label for="chanel">Contactar por</label>
            <select name="chanel" id="chanel">
                <option>Whatsapp</option>
                <option>Telegram</option>
                <option>X</option>
                <option>Instagram</option>
                <option>Tiktok</option>
                <option>Otras</option>
            </select>
            <label>ID o URL</label>
            <input id="chanel-input" type="text" class="grupo-input">

        </div>
        <h2>Mascota</h2>
        <div id="mascota"></div>
        <div>
            <label for="type" class="obligatorio">Tipo</label>
            <select name="type" id="type" class="grupo-input">
                <option>Perro</option>
                <option>Gato</option>
            </select>

            <label for="cantidad" class="obligatorio">Cantidad</label>
            <input id="cantidad" type="number" name="cantidad" class="grupo-input">

            <label for="age" class="obligatorio">Edad</label>
            <input id="age" type="number" name="age" class="grupo-input">

            <label for="medida" class="obligatorio">Unidad de medida edad</label>
            <select name="medida" id="medida" class="grupo-input">
                <option>Meses</option>
                <option>Años</option>
            </select>

            <label for="deliver" class="obligatorio">Fecha disponible para entrega</label>
            <input id="deliver" type="datetime-local" name="deliver" class="grupo-input">

            <label for="description">Descripción</label>
            <textarea id="description" type="text" name="description" cols="50" rows="10" class="grupo-input"></textarea>

            <label for="photo" class="obligatorio">Foto</label>
            <input id="photo" type="file" name="photo" class="grupo-input">
        </div>
    </form>
    <button id="add-aviso">Agregar este aviso de adopción</button>
</div>
</body>
<script src="../js/agregar_aviso.js"></script>
<script src="../js/select.js"></script>
</html>
